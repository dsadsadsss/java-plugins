name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package -B --no-transfer-progress

      - name: Get version and metadata from pom.xml
        id: get_version
        run: |
          # 获取 pom.xml 中的 artifactId 和 version
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 根据触发条件动态生成 Release 名称
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            echo "release_name=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.release_name }}
          name: "AppPlugin ${{ steps.get_version.outputs.release_name }}"
          body: |
            ## AppPlugin ${{ steps.get_version.outputs.release_name }}
            
            ### 🚀 安装方法
            1. 下载 `ui` 附件中的 `${{ steps.get_version.outputs.artifact_id }}-${{ steps.get_version.outputs.version }}.jar`
            2. 将其放入 Minecraft 服务器的 `plugins/` 目录下
            3. 重启服务器（插件会自动在 `plugins/AppPlugin/config.yml` 生成默认配置，或直接读取对应的系统环境变量）
            
            ### 📌 运行要求
            - **核心：** Paper 1.20.4+ (或更高版本核心)
            - **环境：** Java 21+
            
            ### 📝 更新日志
            ${{ github.event.head_commit.message || '通过手动调度或无 Commit 消息触发构建' }}
            
            ---
            **构建提交：** `${{ github.sha }}`
          # 使用前面动态获取的 artifactId 来精确匹配 target 下的目标二进制文件
          files: target/${{ steps.get_version.outputs.artifact_id }}-*.jar
          draft: false
          prerelease: false
