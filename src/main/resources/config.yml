# ====================================================================
# AppPlugin 默认配置文件
# ====================================================================

# 基础运行端口
PORT: "3000"

# VPATH 与 对应本地端口
VPATH: "vls-123456"
VL_PORT: "8002"

# MPATH 与 对应本地端口
MPATH: "vms-3456789"
VM_PORT: "8001"

# 核心协议类型 (vms 或 vls)
XIEYI: "vms"

# 统一认证 UUID
UUID: "3a8a1de5-7d41-45e2-88fe-0f538b822169"

# 优选 IP 参数
CF_IP: "ip.sb"

# 哪吒订阅/节点显示的名称
SUB_NAME: "Minecraft-Paper"
SUB_URL: ""

# 外部保活 URL (不需要填 https://，只填域名/路径)
BAOHUO_URL: ""

# 哪吒服务器端点 (如果是 agent2，通常带有端口，如: tz.example.com:443)
NSERVER: "xxx:443"
# 哪吒节点密钥/API Token
NKEY: ""
NPORT: "443"
NTLS: "--tls"

# 隧道连接 Token (如果填写，CFF 将优先使用 Token 模式启动)
TOK: ""

# --------------------------------------------------------------------
# 📢 日志显示控制 (SHOW_LOGS)
# --------------------------------------------------------------------
# true  : 显示插件的所有运行日志、常驻进程守望轮询日志（默认）
# false : 隐藏高频轮询和同步日志，保持控制台整洁，只在出现严重错误时提示
# --------------------------------------------------------------------
SHOW_LOGS: true

# --------------------------------------------------------------------
# ⚠️ 核心落地目录配置 (FILE_PATH)
# --------------------------------------------------------------------
# 默认留空时自动选择插件数据文件夹：plugins/AppPlugin
# 若面板出现 Permission denied (error: 13)，请修改为 "/tmp" 或 "/dev/shm"
# --------------------------------------------------------------------
FILE_PATH: ""
