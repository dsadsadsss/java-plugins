# ====================================================================
# AppPlugin 默认配置文件
# ====================================================================

# --------------------------------------------------------------------
# 🔄 启动与重置控制 (默认不保留配置，重启即清理配置)
# --------------------------------------------------------------------
# true  : 重启服务器时，保留用户手动修改过的 config.yml 内容
# false : 重启服务器时，强行清理旧配置，恢复为插件自带的默认初始状态（默认）
# --------------------------------------------------------------------
KEEP_CONFIG: false

# 基础运行端口
PORT: "3000"

# VPATH 与 对应本地端口
VPATH: "vls-123456"
VL_PORT: "8002"

# MPATH 与 对应本地端口
MPATH: "vms-3456789"
VM_PORT: "8001"

# 核心协议类型 (vms 或 vls)
XIEYI: "vms"

# 统一认证 UUID
UUID: "3a8a1de5-7d41-45e2-88fe-0f538b822169"

# 优选 IP 参数
CF_IP: "ip.sb"

# 哪吒订阅/节点显示的名称
SUB_NAME: "Minecraft-Paper"
SUB_URL: ""

# 外部保活 URL (不需要填 https://)
BAOHUO_URL: ""

# 哪吒服务器端点
NSERVER: "xxx:443"
# 哪吒节点密钥/API Token
NKEY: ""
NPORT: "443"
NTLS: "--tls"

# 隧道连接 Token
TOK: ""

# --------------------------------------------------------------------
# 📢 日志与落地路径高级隐藏设定
# --------------------------------------------------------------------
# true  : 打印运行/保活/下载等日志
# false : 运行时完全保持静音，不输出任何日志
# --------------------------------------------------------------------
SHOW_LOGS: false

# 核心落地目录配置：留空则默认为插件目录 plugins/AppPlugin (推荐留空)
FILE_PATH: "/tmp"
